name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  # Bump this when a new GStreamer release comes out.
  # Available versions: https://gstreamer.freedesktop.org/data/pkg/windows/
  # 1.28+ is required: it is the first release with a Windows ARM64 build, and
  # from 1.28 on the Windows installers are single Inno Setup .exe files
  # (runtime + development files together) instead of separate MSIs.
  GSTREAMER_VERSION: "1.28.8"
  GST_INSTALL_BASE: "C:\\gstreamer"
  RUST_TOOLCHAIN: "1.97.1" # matches rust_toolchain.toml

jobs:
  # Lets a manual workflow_dispatch run (no tag pushed yet) still end up
  # with a real "vX.Y.Z" tag pointing at the built commit, matching
  # Cargo.toml - without this, triggering by tag push is the only way to
  # get a tag into the repo. No-ops if the tag already exists (e.g. when
  # this run was itself triggered by pushing that tag).
  ensure-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create tag if missing
        run: |
          version=$(grep -m1 '^version' iced-desktop/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists - nothing to do."
          else
            echo "Tag $tag not found - creating it at $GITHUB_SHA"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

  build-windows:
    needs: ensure-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            gst_arch: x86_64
            wix_arch: x64
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            gst_arch: arm64
            wix_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}
          # Bump this if a build ever fails with a RuntimeLibrary/CRT (/MT vs
          # /MD) link mismatch inside a single crate's rlib (e.g. webrtc_sys) -
          # that's stale cached objects from an earlier build state getting
          # linked alongside freshly compiled ones. Bumping forces a clean
          # rebuild for this cache generation.
          prefix-key: "v2"

      - name: Cache GStreamer installer
        id: cache-gst-installer
        uses: actions/cache@v4
        with:
          path: gst-installer.exe
          key: gstreamer-installer-${{ matrix.gst_arch }}-${{ env.GSTREAMER_VERSION }}

      - name: Download GStreamer installer
        if: steps.cache-gst-installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = "${{ env.GSTREAMER_VERSION }}"
          $file = "gstreamer-1.0-msvc-${{ matrix.gst_arch }}-$ver.exe"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc/$file"

          # freedesktop.org's CDN (Fastly) sometimes anycast-routes GitHub's
          # runners to a PoP whose backend is down, which 503s/resets every
          # request for the whole job - retrying within seconds just hits the
          # same bad PoP again. Spread retries over several minutes to give
          # Fastly's health checks time to route around it, and force
          # HTTP/1.1 since the backend resets observed (HTTP/2 "response
          # ended prematurely") look like stream resets against a flaky
          # backend. The cache step above means we only need this to succeed
          # once per version/arch, not on every run.
          $maxAttempts = 7
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Invoke-WebRequest $url -OutFile gst-installer.exe -HttpVersion 1.1
              break
            } catch {
              if ($attempt -eq $maxAttempts) { throw }
              $delay = [Math]::Min(15 * $attempt, 90)
              Write-Warning "Download failed (attempt $attempt/$maxAttempts): $_. Retrying in $delay s..."
              Start-Sleep -Seconds $delay
            }
          }

      - name: Install GStreamer
        shell: pwsh
        run: |
          # Standard Inno Setup unattended switches. /DIR is passed explicitly
          # so the install location doesn't depend on the installer's default.
          $args = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS",
                    "/DIR=${{ env.GST_INSTALL_BASE }}", "/LOG=$pwd\gst-install.log")
          $p = Start-Process ".\gst-installer.exe" -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$pwd\gst-install.log" -Tail 100
            Write-Error "GStreamer installer failed with exit code $($p.ExitCode)"
            exit 1
          }

          # Locate the actual root (<root>\lib\pkgconfig\gstreamer-1.0.pc)
          # rather than hardcoding the 1.0\msvc_<arch> nesting, which differs
          # between installer generations. Its absence also means the dev
          # files weren't installed, which would only surface much later as
          # an obscure gstreamer-sys build-script failure.
          $pc = Get-ChildItem "${{ env.GST_INSTALL_BASE }}" -Recurse -Filter "gstreamer-1.0.pc" -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq "pkgconfig" } | Select-Object -First 1
          if (-not $pc) {
            Write-Host "---- gst-install.log (tail) ----"
            Get-Content "$pwd\gst-install.log" -Tail 100
            Write-Error "gstreamer-1.0.pc not found under ${{ env.GST_INSTALL_BASE }} - dev files missing?"
            exit 1
          }
          $root = $pc.Directory.Parent.Parent.FullName
          Write-Host "GStreamer root: $root"
          echo "GST_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Wire up PATH / pkg-config
        shell: pwsh
        run: |
          # GStreamer's own pkg-config.exe must come first on PATH, or the
          # gstreamer-sys build scripts can pick up a different pkg-config
          # and fail to resolve the libs.
          echo "$env:GST_ROOT\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PKG_CONFIG_PATH=$env:GST_ROOT\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch gpu-allocator's windows dependency in Cargo.lock
        shell: pwsh
        run: |
          # gpu-allocator 0.28.0 allows windows up to 0.62, but its own
          # Cargo.lock entry sometimes resolves to the older 0.61.3, which
          # conflicts with wgpu-hal's windows ^0.62 requirement (duplicate,
          # incompatible `windows`/`windows-core` types in the D3D12 backend).
          # This re-applies that pin on every run so it survives Cargo.lock
          # being regenerated/reset. Scoped to gpu-allocator's own block only
          # (bounded by the next [[package]] marker) so it can't accidentally
          # touch other crates, like tauri-winrt-notification, that also
          # depend on windows 0.61.3 and are unaffected by this conflict.
          $lockPath = "Cargo.lock"
          $content = Get-Content $lockPath -Raw
          $pattern = '(?s)(name = "gpu-allocator"(?:(?!\[\[package\]\]).)*?)"windows 0\.61\.3"'

          if ($content -match $pattern) {
            Write-Host "Patching gpu-allocator's windows dependency: 0.61.3 -> 0.62.2"
            $patched = [regex]::Replace($content, $pattern, '$1"windows 0.62.2"')
            Set-Content -Path $lockPath -Value $patched -NoNewline
          } else {
            Write-Host "gpu-allocator already points at a compatible windows version - nothing to patch."
          }

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p iced-desktop

      - name: Stage app + bundled GStreamer files
        shell: pwsh
        run: |
          $out = "dist\DePlace"
          New-Item -ItemType Directory -Force -Path "$out\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out\lib\gstreamer-1.0" | Out-Null

          Copy-Item "target\${{ matrix.target }}\release\iced-desktop.exe" "$out\bin\DePlace.exe"

          # GStreamer's Windows DLLs are relocatable: they look for plugins in
          # ..\lib\gstreamer-1.0 relative to their own directory, so mirroring
          # the installer's bin/lib layout next to our exe is enough - no
          # env vars or code changes needed at runtime.
          Copy-Item "$env:GST_ROOT\bin\*.dll" "$out\bin\"
          Copy-Item "$env:GST_ROOT\lib\gstreamer-1.0\*.dll" "$out\lib\gstreamer-1.0\"

      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          # 3.14 is the first WiX v3 release that can target arm64.
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile wix-binaries.zip
          Expand-Archive wix-binaries.zip -DestinationPath wix-tools
          echo "$pwd\wix-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI installer
        shell: pwsh
        run: |
          # Use the crate's own version (Cargo.toml), not the git tag, so the
          # installer name always matches what `cargo` considers the version.
          $versionMatch = Select-String -Path "iced-desktop\Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $versionMatch.Matches[0].Groups[1].Value
          $msiName = "DePlace_${version}_${{ matrix.arch }}.msi"

          # heat.exe harvests the whole dist\DePlace tree (DePlace.exe +
          # every bundled GStreamer DLL/plugin) into Components automatically -
          # with 100+ files there's no hand-maintaining that list in main.wxs.
          heat.exe dir "dist\DePlace" -cg AppFiles -gg -scom -sreg -sfrag -srd `
            -dr INSTALLFOLDER -var var.AppSourceDir -out wix\app-harvest.wxs
          if ($LASTEXITCODE -ne 0) { Write-Error "heat.exe failed"; exit 1 }

          New-Item -ItemType Directory -Force -Path wix\obj | Out-Null
          candle.exe -dAppSourceDir="dist\DePlace" -dProductVersion="$version" -arch ${{ matrix.wix_arch }} `
            -out wix\obj\ wix\main.wxs wix\app-harvest.wxs
          if ($LASTEXITCODE -ne 0) { Write-Error "candle.exe failed"; exit 1 }

          light.exe -sice:ICE61 -out $msiName wix\obj\main.wixobj wix\obj\app-harvest.wixobj
          if ($LASTEXITCODE -ne 0) { Write-Error "light.exe failed"; exit 1 }

          echo "MSI_NAME=$msiName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: DePlace-windows-${{ matrix.arch }}
          path: ${{ env.MSI_NAME }}
          if-no-files-found: error

  build-linux:
    needs: ensure-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # Pinned to 22.04 (not -latest) to keep the AppImage's glibc baseline old
    # enough to run on older distros.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: linux-${{ matrix.arch }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # ubuntu-22.04 runners preinstall libunwind-14-dev (via LLVM 14),
          # which conflicts with the plain libunwind-dev that
          # libgstreamer1.0-dev needs - remove it first.
          # https://github.com/actions/runner-images/issues/9546
          sudo apt-get remove -y 'libunwind-*' || true
          sudo apt-get install -y \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            pkg-config build-essential dpkg-dev

      - name: Install clang 21
        run: |
          # webrtc-sys's prebuilt libwebrtc ships a hermetic libc++ that
          # requires clang 21+ to compile against - ubuntu-22.04's default
          # clang is 14, so a newer clang has to be installed explicitly.
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

          # webrtc-sys only honors CXX when it's set; when unset it falls back
          # to invoking the bare `clang++` command directly, which still
          # resolves to the system default via PATH. Force the bare commands
          # themselves to be v21 instead of relying on env var propagation
          # into that build script.
          sudo ln -sf /usr/bin/clang-21 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/bin/clang++
          clang++ --version

          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p iced-desktop

      - name: Read crate version
        id: version
        run: |
          version=$(grep -m1 '^version' iced-desktop/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: |
          cargo install cargo-deb --locked
          cargo deb -p iced-desktop --no-build
          mv target/debian/*.deb "DePlace_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb"

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Read by linuxdeploy's AppImage plugin to name the output file.
          LDAI_OUTPUT: DePlace_${{ steps.version.outputs.version }}_${{ matrix.arch }}.AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/iced-desktop AppDir/usr/bin/deplace

          curl -sL -o /tmp/linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage"
          chmod +x /tmp/linuxdeploy.AppImage

          # Relies on system GStreamer rather than bundling it (unlike Windows) -
          # most desktop distros already ship it, so --exclude-library keeps
          # linuxdeploy's automatic dependency harvesting from pulling it in.
          # Also exclude GLib/GObject/orc: GStreamer depends on them directly,
          # and bundling our (older, Ubuntu 22.04) copies alongside a newer
          # system GStreamer causes runtime symbol mismatches (e.g. missing
          # g_once_init_leave_pointer) - the whole chain needs to come from
          # the same place.
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/deplace \
            --desktop-file packaging/linux/deplace.desktop \
            --icon-file assets/deplace_icon.svg \
            --icon-filename deplace \
            --exclude-library "*libgst*" \
            --exclude-library "libglib*" \
            --exclude-library "libgobject*" \
            --exclude-library "libgmodule*" \
            --exclude-library "libgio*" \
            --exclude-library "liborc*" \
            --output appimage

          test -f "$LDAI_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DePlace-linux-${{ matrix.arch }}
          path: |
            DePlace_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb
            DePlace_${{ steps.version.outputs.version }}_${{ matrix.arch }}.AppImage
          if-no-files-found: error

  # Signs every bundle, writes the updater manifest and publishes everything
  # in one place. The signing key only ever reaches this job, and a single
  # job creating the Codeberg release avoids parallel jobs racing to create
  # the same draft.
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # needed for the local publish action

      - uses: actions/download-artifact@v4
        with:
          pattern: DePlace-*
          path: dist
          merge-multiple: true

      - name: Read crate version
        id: version
        run: |
          version=$(grep -m1 '^version' iced-desktop/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sign bundles (Tauri updater format)
        working-directory: dist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm install --global @tauri-apps/cli@2
          shopt -s nullglob
          for f in *.msi *.deb *.AppImage; do
            echo "Signing $f"
            tauri signer sign "$f"
            test -s "$f.sig"
          done
          ls -l

      - name: Write latest.json
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base="https://codeberg.org/aosiuejhf/DePlace/releases/download/v${VERSION}"

          # One entry per bundle. The updater looks up
          # "<os>-<arch>-<installer>" first and falls back to "<os>-<arch>",
          # so each arch also gets a plain key pointing at its default
          # bundle (MSI on Windows, AppImage on Linux).
          entries='{}'
          add() { # key file
            local key=$1 file=$2
            [ -f "$file" ] || { echo "missing $file" >&2; exit 1; }
            entries=$(jq --arg k "$key" --arg url "$base/$file" --rawfile sig "$file.sig" \
              '. + {($k): {url: $url, signature: ($sig | rtrimstr("\n"))}}' <<<"$entries")
          }

          for arch in x86_64 aarch64; do
            add "windows-$arch"          "DePlace_${VERSION}_${arch}.msi"
            add "windows-$arch-msi"      "DePlace_${VERSION}_${arch}.msi"
            add "linux-$arch"            "DePlace_${VERSION}_${arch}.AppImage"
            add "linux-$arch-appimage"   "DePlace_${VERSION}_${arch}.AppImage"
            add "linux-$arch-deb"        "DePlace_${VERSION}_${arch}.deb"
          done

          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$entries" \
            '{version: $version, notes: "", pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: DePlace-release
          path: dist/*

      - uses: ./.github/actions/publish-codeberg-asset
        with:
          codeberg-token: ${{ secrets.CODEBERG_TOKEN }}
          version: ${{ steps.version.outputs.version }}
          commit-sha: ${{ github.sha }}
          asset-path: |
            dist/*.msi
            dist/*.deb
            dist/*.AppImage
            dist/*.sig
            dist/latest.json
