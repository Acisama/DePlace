[package]
name = "sweeten"
version = "0.15.0-dev"
edition = "2024"
rust-version = "1.92"
authors = ["Andy Terra <tech@andyterra.com>"]
description = "`sweeten` your daily `iced` brew"
license = "MIT"
repository = "https://github.com/airstrike/sweeten"
keywords = ["gui", "iced", "widgets"]
categories = ["gui"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--extend-css", "doc-style.css"]

[[example]]
name = "focus"
required-features = ["broken"]

[dependencies]
iced_core = { git = "https://github.com/acisama/iced", version = "0.15.0-dev" }
iced_runtime = { git = "https://github.com/acisama/iced", version = "0.15.0-dev" }
iced_widget = { git = "https://github.com/acisama/iced", version = "0.15.0-dev" }
indexmap = "2.14.2"
unicode-segmentation = "1.11.0"

[dev-dependencies]
iced = { git = "https://github.com/acisama/iced", version = "0.15.0-dev", features = ["advanced", "markdown", "svg", "tokio"] }
iced_test = { git = "https://github.com/acisama/iced", version = "0.15.0-dev" }
tokio = { version = "1", features = ["time"] }

# Uncomment to test against local iced checkout
# [patch.crates-io]
# iced.path = "../iced"
# iced_core.path = "../iced/core"
# iced_runtime.path = "../iced/runtime"
# iced_widget.path = "../iced/widget"
# iced_test.path = "../iced/test"

[features]
broken = []
crisp = ["iced_core/crisp"]

[lints.clippy]
needless_borrow = "deny"
redundant-closure-for-method-calls = "deny"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
useless_conversion = "deny"

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("advanced"))'] }
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
