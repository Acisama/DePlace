[workspace]
resolver = "2"
members = [
  "deplace_core",
  "desktop",
]

default-members = ["desktop"]

[workspace.dependencies]
deplace_core = { path = "deplace_core" }

anyhow = "1"
chrono = "0.4.45"
csscolorparser = "0.8.3"
dirs = "6.0.0"
futures-util = "0.3"
getrandom = "0.4.3"
gpui = { git = "https://github.com/zed-industries/zed" }
image = "0.25.10"
imbl = "6.1.0"
interprocess = { version = "2", features = ["tokio"] }
matrix-sdk = {
  version = "0.18.0",
  features = [
    "anyhow",
    "e2e-encryption",
    "experimental-element-recent-emojis",
    "experimental-search",
    "experimental-send-custom-to-device",
    "sqlite",
  ]
}
matrix-sdk-ui = "0.18.0"
ruma = { version = "0.16.0", features = ["unstable-msc4095"] }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
livekit = "0.8.1"
base64 = "0.23.0"
uuid = "1.24.0"
reqwest = { version = "0.13.4", features = ["json"] }

[workspace.lints.clippy]
arithmetic_side_effects = "warn"
as_conversions = "warn"
exit = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
panic_in_result_fn = "warn"
string_slice = "warn"
todo = "warn"
unchecked_time_subtraction = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[patch."https://github.com/zed-industries/zed"]
gpui = {
  git = "https://github.com/acisama/zed",
  branch = "main",
  version = "=0.2.2"
}
gpui_macros = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_wgpu = { git = "https://github.com/acisama/zed", branch = "main" }
# gpui = { path = "/home/eriko/zed/crates/gpui" }
# gpui_macros = { path = "/home/eriko/zed/crates/gpui_macros" }
# gpui_wgpu = { path = "/home/eriko/zed/crates/gpui_wgpu" }
