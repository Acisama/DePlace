[workspace]
resolver = "2"
members = [
  "core",
  "desktop",
]

default-members = ["desktop"]

[workspace.dependencies]
core = { path = "core" }

anyhow = "1"
gpui = "0.2"
interprocess = { version = "2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
