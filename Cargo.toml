[workspace]
resolver = "2"
members = [
  "deplace_core",
  "desktop",
  "macros",
]

default-members = ["desktop"]

[workspace.dependencies]
deplace_core = { path = "deplace_core" }
macros = { path = "macros" }

anyhow = "1"
base64 = "0.23.0"
blurhash = "0.2.3"
chrono = "0.4.45"
csscolorparser = "0.8.3"
dashmap = "7.0.0-rc2"
dirs = "6.0.0"
futures-util = "0.3"
getrandom = "0.4.3"
gpui = { git = "https://github.com/zed-industries/zed" }
image = "0.25.10"
imbl = "6.1.0"
interprocess = { version = "2", features = ["tokio"] }
# livekit = "0.8.1"
matrix-sdk = {
  version = "0.18.0",
  features = [
    "anyhow",
    "bundled-sqlite",
    "e2e-encryption",
    "experimental-element-recent-emojis",
    "experimental-search",
    "experimental-send-custom-to-device",
  ]
}
matrix-sdk-ui = "0.18.0"
reqwest = { version = "0.13.4", features = ["json"] }
ruma = { version = "0.16.0", features = ["unstable-msc4095"] }
ruma-html = { version = "0.8.0", features = ["matrix"] }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
smallvec = "1.15.2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.24.0"

[patch."https://github.com/zed-industries/zed"]
collections = { git = "https://github.com/acisama/zed", branch = "main" }
gpui = {
  git = "https://github.com/acisama/zed",
  branch = "main",
  version = "=0.2.2"
}
gpui_linux = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_macos = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_macros = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_platform = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_util = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_web = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_wgpu = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_windows = { git = "https://github.com/acisama/zed", branch = "main" }
http_client = { git = "https://github.com/acisama/zed", branch = "main" }
media = { git = "https://github.com/acisama/zed", branch = "main" }
