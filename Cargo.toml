[workspace]
resolver = "2"
members = [
  "deplace_core",
  # "desktop",
  "iced-desktop",
  "macros",
]

default-members = ["iced-desktop"]

[workspace.dependencies]
deplace_core = { path = "deplace_core" }
macros = { path = "macros" }

anyhow = "1"
base64 = "0.23.0"
blurhash = "0.2.3"
chrono = "0.4.45"
chrono-tz = { version = "0.10.4", features = ["serde"] }
const_format = "0.2.36"
csscolorparser = "0.8.3"
dashmap = "7.0.0-rc2"
dirs = "6.0.0"
enumset = { version = "1.1.14", features = ["serde"] }
futures = "0.3.34"
futures-util = "0.3"
getrandom = "0.4.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-video-player = { git = "https://github.com/acisama/gpui-video-player" }
iced = { git = "https://github.com/acisama/iced", version = "0.15.0-dev", features = ["advanced", "canvas", "debug", "image", "svg", "time-travel", "tokio"] }
iced_video_player = { git = "https://codeberg.org/aosiuejhf/iced_video_player.git" }
image = "0.25.10"
imbl = "6.1.0"
indexmap = "2.14.1"
infer = "0.22.0"
interprocess = { version = "2", features = ["tokio"] }
# livekit = "0.8.1"
lru = "0.18.2"
matrix-sdk = { version = "0.18.0", features = ["anyhow", "bundled-sqlite", "e2e-encryption", "experimental-element-recent-emojis", "experimental-search", "experimental-send-custom-to-device", "sso-login"] }
matrix-sdk-ui = "0.18.0"
mime = "0.3.17"
mime_guess = "2.0.5"
nucleo = "0.5.0"
phosphor-svgs = "0.3.0"
rayon = "1.12.0"
ruma = { version = "0.16.0", features = ["unstable-msc4095"] }
ruma-html = { version = "0.8.0", features = ["matrix"] }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
smallvec = "1.15.2"
sweeten = { git = "https://codeberg.org/aosiuejhf/sweeten-fork.git", branch = "master" }
thumbhash = "0.1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
toml_edit = { version = "0.25.13", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
url-macro = "0.2.4"
uuid = { version = "1.24.0", features = ["v7"] }

# [patch."https://github.com/acisama/iced"]
