gpui_linux = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_macos = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_macros = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_platform = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_util = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_web = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_wgpu = { git = "https://github.com/acisama/zed", branch = "main" }
gpui_windows = { git = "https://github.com/acisama/zed", branch = "main" }
http_client = { git = "https://github.com/acisama/zed", branch = "main" }
media = { git = "https://github.com/acisama/zed", branch = "main" }
